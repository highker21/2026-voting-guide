<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2026 投票指南</title>
<style>
  :root {
    --bg: #f7f6f2; --card: #ffffff; --ink: #1f2933; --muted: #5f6b7a; --line: #d9dde3;
    --accent: #0b5563; --accent-soft: #e3f0f2; --warn-bg: #fff4d6; --warn-ink: #7a5300; --chip: #eef1f4;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14181d; --card: #1d232a; --ink: #e6e9ed; --muted: #9aa5b1; --line: #313a44;
      --accent: #6cc3d0; --accent-soft: #1f3a40; --warn-bg: #3a3016; --warn-ink: #f0cf7a; --chip: #262e37;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; overflow-x: hidden; }
  body { background: var(--bg); color: var(--ink); font-family: "PingFang TC", "Noto Sans TC", "Heiti TC", sans-serif; font-size: 16px; line-height: 1.6; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.5rem; margin: 4px 0 2px; color: var(--accent); }
  .sub { color: var(--muted); font-size: .92rem; }
  .banner { margin: 12px 0; padding: 10px 12px; border-radius: 10px; background: var(--accent-soft); font-size: .95rem; }
  .banner b { color: var(--accent); }
  .neutral { margin: 12px 0; padding: 10px 12px; border-left: 4px solid var(--accent); background: var(--card); font-size: .9rem; color: var(--muted); }
  .picker { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 8px 0 10px; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
  .picker label { display: flex; flex-direction: column; font-size: .78rem; color: var(--muted); min-width: 0; }
  .picker select { font: inherit; font-size: .95rem; padding: 6px 8px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--card); color: var(--ink); width: 100%; min-width: 0; }
  .picker select:disabled { opacity: .5; }
  .race { margin-top: 18px; }
  .race-head h2 { margin: 0; font-size: 1.25rem; }
  .race-head .meta { color: var(--muted); font-size: .9rem; }
  .issue-bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 8px 0 12px; font-size: .9rem; }
  .issue-bar button { font: inherit; font-size: .85rem; padding: 3px 10px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
  .issue-bar button.on { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  .cards { display: grid; gap: 12px; margin-top: 8px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .card header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 10px; }
  .num { min-width: 2.2em; text-align: center; font-weight: 700; border: 2px solid var(--accent); color: var(--accent); border-radius: 8px; padding: 0 6px; }
  .num.none { border-style: dashed; color: var(--muted); border-color: var(--line); font-weight: 400; font-size: .8rem; }
  .name { font-size: 1.15rem; font-weight: 700; overflow-wrap: anywhere; }
  .party { font-size: .88rem; color: var(--muted); }
  .tag { font-size: .78rem; padding: 1px 8px; border-radius: 10px; background: var(--chip); color: var(--muted); }
  details { margin-top: 8px; border-top: 1px dashed var(--line); padding-top: 6px; }
  summary { cursor: pointer; font-weight: 600; font-size: .95rem; color: var(--accent); }
  ul.facts { margin: 6px 0 4px; padding-left: 1.2em; }
  ul.facts li { margin: 3px 0; overflow-wrap: anywhere; }
  .src { font-size: .72rem; vertical-align: super; margin-left: 2px; color: var(--accent); text-decoration: none; }
  .unoff { display: inline-block; font-size: .72rem; margin-left: 4px; padding: 0 6px; border-radius: 8px; background: var(--warn-bg); color: var(--warn-ink); }
  .issue-label { font-size: .75rem; padding: 0 6px; margin-right: 4px; border-radius: 8px; background: var(--chip); color: var(--muted); }
  .empty { color: var(--muted); font-size: .9rem; font-style: italic; }
  .pending { color: var(--warn-ink); background: var(--warn-bg); display: inline-block; padding: 2px 8px; border-radius: 8px; font-size: .85rem; }
  .money { font-size: .9rem; }
  .links a { margin-right: 10px; font-size: .9rem; color: var(--accent); }
  .compare { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; margin-bottom: 12px; }
  .compare h3 { margin: 0 0 6px; font-size: 1rem; }
  .compare .row { padding: 6px 0; border-top: 1px dashed var(--line); }
  .compare .row:first-of-type { border-top: 0; }
  .compare .who { font-weight: 700; margin-right: 6px; }
  .hint { margin: 18px 0; color: var(--muted); }
  .search { margin: 12px 0 4px; position: relative; }
  .search label { display: block; font-size: .78rem; color: var(--muted); margin-bottom: 2px; }
  .search input { width: 100%; box-sizing: border-box; font: inherit; font-size: 1rem; padding: 9px 12px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--card); color: var(--ink); }
  #q-results { list-style: none; margin: 4px 0 0; padding: 0; border: 1px solid var(--line); border-radius: 10px; background: var(--card); max-height: 60vh; overflow-y: auto; }
  #q-results li { padding: 8px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
  #q-results li:last-child { border-bottom: 0; }
  #q-results li:hover, #q-results li:focus { background: var(--chip); outline: none; }
  #q-results .qn { font-weight: 700; } #q-results .qm { display: block; font-size: .82rem; color: var(--muted); }
  #q-results .more { cursor: default; color: var(--muted); font-size: .85rem; }
  .addr-row { display: flex; gap: 6px; }
  .addr-row input { flex: 1; min-width: 0; }
  .addr-row button { font: inherit; padding: 0 14px; border-radius: 10px; border: 1.5px solid var(--accent); background: var(--accent); color: #fff; font-weight: 700; cursor: pointer; }
  .addr-msg { margin: 6px 2px 0; font-size: .88rem; padding: 6px 10px; border-radius: 8px; background: var(--chip); }
  .geo { margin-top: 6px; font: inherit; font-size: .88rem; padding: 6px 12px; border-radius: 10px; border: 1.5px solid var(--accent); background: var(--card); color: var(--accent); cursor: pointer; }
  .qnote { margin: 4px 2px 0; font-size: .75rem; color: var(--muted); }
  .card.hit { outline: 3px solid var(--accent); outline-offset: 2px; }
  @media print { .search { display: none !important; } }
  .tabs { display: flex; gap: 6px; margin: 14px 0 6px; position: sticky; top: 0; z-index: 3; background: var(--bg); padding: 6px 0; border-bottom: 1px solid var(--line); }
  .tabs button { flex: 1; font: inherit; font-size: .95rem; padding: 8px 4px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--card); color: var(--ink); cursor: pointer; }
  .tabs button[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
  .tabs .cnt { display: inline-block; margin-left: 4px; font-size: .75rem; opacity: .85; }
  @media print { .tabs { display: none; } .pane[hidden] { display: block !important; } }
  section#timeline, section#sources { margin-top: 24px; }
  section h2 { font-size: 1.15rem; }
  ol.tl { padding-left: 1.2em; }
  .reg { margin: 2px 0 4px; font-size: .82rem; color: var(--muted, #667); }
  ol.src-list { padding-left: 1.6em; font-size: .9rem; overflow-wrap: anywhere; }
  ol.src-list li:target { background: var(--warn-bg); }
  footer { margin: 28px 0 8px; padding-top: 10px; border-top: 1px solid var(--line); font-size: .82rem; color: var(--muted); }
  .err { padding: 12px; background: var(--warn-bg); color: var(--warn-ink); border-radius: 8px; }
  @media (max-width: 420px) { .picker { grid-template-columns: 1fr 1fr; } .picker label:last-child { grid-column: 1 / -1; } }
  @media print {
    .picker, .issue-bar { display: none; }
    details { display: block; } details > summary { display: none; }
    .card { break-inside: avoid; }
    a { color: inherit; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title">2026 投票指南</h1>
  <div class="sub" id="sub"></div>
  <div class="banner" id="banner" hidden></div>
  <div class="neutral">本頁只整理選委會等官方公開資料，不推薦、不評價任何候選人。候選人順序：抽籤前依登記順序，抽籤後依號次。每一項內容都附出處；標示「媒體報導，未經官方確認」的項目，尚未取得官方資料佐證。</div>
  <div class="search">
    <label for="q">搜尋候選人</label>
    <input id="q" type="search" placeholder="輸入姓名，例如：陳" autocomplete="off" enterkeyhint="search">
    <ol id="q-results" hidden></ol>
    <p class="qnote">少數姓名含罕用字的候選人無法用姓名搜尋，請改用下方縣市、區、村里選單查詢。</p>
  </div>
  <div class="search addr">
    <label for="addr">輸入戶籍地址，自動帶出選區</label>
    <div class="addr-row"><input id="addr" type="text" placeholder="例：臺北市大安區忠孝東路四段1號" autocomplete="street-address"><button type="button" id="addr-go">帶入</button></div>
    <p class="qnote">地址只在您的裝置上比對，不會傳送或儲存。</p>
    <p id="addr-msg" class="addr-msg" hidden></p>
    <button type="button" id="geo-go" class="geo">📍 用目前位置判斷村里</button>
  </div>
  <div class="picker">
    <label>縣市<select id="sel-county"><option value="">請選擇</option></select></label>
    <label>鄉鎮市區<select id="sel-town" disabled><option value="">請先選縣市</option></select></label>
    <label>村里<select id="sel-village" disabled><option value="">請先選鄉鎮市區</option></select></label>
  </div>
  <main id="races"><p class="hint">請先選擇縣市。</p></main>
  <section id="timeline"></section>
  <section id="sources"></section>
  <footer>
    改作自 <a href="https://github.com/g0v/2020voting-guide">g0v 2020voting-guide</a>（CC BY-NC 3.0 TW），僅供非商業使用。資料整理：個人製作，非任何政黨或候選人製作。<br>
    工具版本：2026-10-09
  </footer>
</div>
<script>
(function () {
  const $ = (s, el) => (el || document).querySelector(s);
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const asList = s => Array.isArray(s) ? s : (s ? [s] : []);
  const PENDING = "選舉公報發布後補上（約 11 月中）";
  const cache = {};
  let INDEX = null, COUNTY = null, LI = null;   // 目前載入的資料
  let SRC = {}, SRC_ORDER = [], ISSUES = {};     // 目前畫面用到的出處（以檔案為命名空間）

  function getJSON(path) {
    if (cache[path]) return cache[path];
    cache[path] = fetch(path, { cache: "no-store" }).then(r => {
      if (r.status === 404) return null;
      if (!r.ok) throw new Error(path + "：HTTP " + r.status);
      return r.json();
    });
    return cache[path];
  }
  function addSources(ns, sources) {
    Object.keys(sources || {}).forEach(id => {
      const key = ns + ":" + id;
      if (!SRC[key]) { SRC[key] = sources[id]; SRC_ORDER.push(key); }
    });
  }
  function srcLinks(ns, srcs) {
    return asList(srcs).map(id => {
      const key = ns + ":" + id, n = SRC_ORDER.indexOf(key) + 1;
      return n > 0 ? `<a class="src" href="#src-${n}">[${n}]</a>` : `<span class="src">[?${esc(id)}]</span>`;
    }).join("");
  }
  function factItem(ns, f, withIssue) {
    const lab = withIssue && f.issue ? `<span class="issue-label">${esc(ISSUES[f.issue] || f.issue)}</span>` : "";
    const un = f.official === false ? `<span class="unoff">媒體報導，未經官方確認</span>` : "";
    const self = f.label ? `<span class="unoff">${esc(f.label)}</span>` : (f.self === true ? `<span class="unoff">候選人自述</span>` : "");
    return `<li>${lab}${esc(f.text)}${srcLinks(ns, f.src)}${self}${un}</li>`;
  }
  function factList(ns, arr, withIssue, emptyText) {
    if (arr && arr.length) return `<ul class="facts">${arr.map(f => factItem(ns, f, withIssue)).join("")}</ul>`;
    return emptyText === PENDING ? `<p><span class="pending">${PENDING}</span></p>` : `<p class="empty">${esc(emptyText || "尚無資料")}</p>`;
  }
  function ordered(cands) {
    if (!cands.some(c => c.number != null)) return cands.slice();
    return cands.slice().sort((a, b) => (a.number ?? 1e9) - (b.number ?? 1e9));
  }
  function money(ns, d, incumbent) {
    if (!d) return `<p class="empty">${incumbent === false ? "非現任，無 2022 年政治獻金資料" : "尚無 2022 年政治獻金資料"}</p>`;
    const f = n => n == null ? "—" : Number(n).toLocaleString("zh-TW");
    return `<p class="money">收入 ${f(d.income)} 元，支出 ${f(d.expense)} 元${srcLinks(ns, d.src)}</p>`;
  }
  function card(ns, c) {
    const num = c.number != null ? `<span class="num">${esc(c.number)}</span>` : `<span class="num none">未抽籤</span>`;
    const party = c.party ? esc(c.party) : "政黨：資料未填";
    const links = (c.links || []).map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join("");
    return `<article class="card" data-cid="${esc(c.id)}">
      <header>${num}<span class="name">${esc(c.name)}</span><span class="party">${party}</span>${c.incumbent ? '<span class="tag" title="依中選會 2022 當選名單；任內補選、解職未計入">2022 當選</span>' : ""}</header>
      ${c.reg ? `<p class="reg">${c.reg.date} 登記參選${srcLinks(ns, c.reg.src)}${c.incumbent == null ? "｜是否現任：尚未比對" : ""}</p>` : ""}
      <details open><summary>經歷</summary>${factList(ns, c.bio, false, PENDING)}</details>
      ${c.incumbent ? `<details open><summary>任內政績</summary>${factList(ns, c.record, false, "尚無任內政績資料")}</details>` : `<details><summary>過去紀錄</summary>${factList(ns, c.record, false)}</details>`}
      <details><summary>政見</summary>${factList(ns, c.platform, true, PENDING)}</details>
      <details><summary>2022 政治獻金</summary>${money(ns, c.donation_2022, c.incumbent)}</details>
      ${links ? `<div class="links">${links}</div>` : ""}
    </article>`;
  }
  function compareBlock(ns, race, issueId) {
    const rows = ordered(race.candidates).map(c => {
      const items = (c.platform || []).filter(p => p.issue === issueId);
      const body = items.length ? `<ul class="facts">${items.map(f => factItem(ns, f, false)).join("")}</ul>` : `<span class="empty">未找到這個議題的政見</span>`;
      return `<div class="row"><span class="who">${esc(c.name)}</span>${body}</div>`;
    }).join("");
    return `<div class="compare"><h3>議題對照：${esc(ISSUES[issueId] || issueId)}</h3>${rows}</div>`;
  }
  function raceEl(ns, race) {
    const el = document.createElement("section");
    el.className = "race";
    const cands = race.candidates || [];
    const issues = Object.keys(ISSUES).filter(id => cands.some(c => (c.platform || []).some(p => p.issue === id)));
    const bar = issues.length ? `<div class="issue-bar"><span>依議題對照：</span>${issues.map(id => `<button data-issue="${esc(id)}">${esc(ISSUES[id])}</button>`).join("")}</div>` : "";
    el.innerHTML = `<div class="race-head"><h2>${esc(race.name)}</h2>
      <div class="meta">${esc(race.type)}｜${esc(race.area)}｜應選 ${esc(race.seats)} 名｜登記 ${cands.length} 人${race.note ? "｜" + esc(race.note) : ""}</div></div>
      ${bar}<div class="cmp"></div>
      <div class="cards">${ordered(cands).map(c => card(ns, c)).join("") || '<p class="empty">尚無登記資料</p>'}</div>`;
    el.querySelectorAll(".issue-bar button").forEach(b => b.addEventListener("click", () => {
      const on = !b.classList.contains("on");
      el.querySelectorAll(".issue-bar button").forEach(x => x.classList.remove("on"));
      if (on) b.classList.add("on");
      $(".cmp", el).innerHTML = on ? compareBlock(ns, race, b.dataset.issue) : "";
    }));
    return el;
  }
  function fillSelect(sel, items, placeholder) {
    sel.innerHTML = `<option value="">${esc(placeholder)}</option>` + items.map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join("");
    sel.disabled = !items.length;
  }
  let TAB = "mayor", FOCUS = null;
  function setHash() {
    const p = new URLSearchParams();
    if ($("#sel-county").value) p.set("c", $("#sel-county").value);
    if ($("#sel-town").value) p.set("t", $("#sel-town").value);
    if ($("#sel-village").value) p.set("v", $("#sel-village").value);
    if (TAB && TAB !== "mayor") p.set("tab", TAB);
    try { history.replaceState(null, "", "#" + p.toString()); } catch (e) {}
  }
  function townsOf(county) {
    if (Array.isArray(county.towns) && county.towns.length) return county.towns.map(t => typeof t === "string" ? t : t.name);
    const s = new Set();
    (county.races || []).forEach(r => (r.districts || []).forEach(d => s.add(d)));
    return [...s];
  }

  function render() {
    SRC = {}; SRC_ORDER = []; ISSUES = {};
    const main = $("#races"); main.innerHTML = "";
    const code = $("#sel-county").value, town = $("#sel-town").value, village = $("#sel-village").value;
    const entry = (INDEX.counties || []).find(c => c.code === code);
    const banner = $("#banner");
    if (!COUNTY || !entry) { banner.hidden = true; main.innerHTML = '<p class="hint">請先選擇縣市。</p>'; $("#timeline").innerHTML = ""; $("#sources").innerHTML = ""; return; }
    banner.hidden = false;
    banner.innerHTML = `${esc(entry.name)}｜目前階段：<b>${esc(entry.stage || "—")}</b>｜資料更新 ${esc(entry.updated || "—")}${(entry.stage || "").includes("登記") ? "。名單為「登記參選」，選委會審定前仍可能變動。" : ""}`;
    const cns = code;
    addSources(cns, COUNTY.sources);
    (COUNTY.issues || []).forEach(i => ISSUES[i.id] = i.name);
    if (LI) { addSources(cns + "/li-" + town, LI.sources); (LI.issues || []).forEach(i => ISSUES[i.id] = i.name); }

    const races = COUNTY.races || [];
    const mayorRaces = races.filter(r => r.id === "mayor");
    const councilAll = races.filter(r => r.id !== "mayor");
    const councilRaces = town ? councilAll.filter(r => !r.districts || !r.districts.length || r.districts.includes(town)) : councilAll;
    councilRaces.sort((a, b) => (a.indigenous ? 1 : 0) - (b.indigenous ? 1 : 0));   // 一般選區在前，原住民選區在後
    const liRaces = (town && LI) ? (LI.races || []).filter(r => !village || r.village === village) : [];
    const lns = cns + "/li-" + town;
    const nCand = rs => rs.reduce((n, r) => n + (r.candidates || []).length, 0);
    const tabs = [
      ["mayor", "縣市長", nCand(mayorRaces)],
      ["council", "議員", nCand(councilRaces)],
      ["li", "村里長", town ? nCand(liRaces) : null],
    ];
    if (!tabs.some(t => t[0] === TAB)) TAB = "mayor";
    main.insertAdjacentHTML("beforeend", `<nav class="tabs" role="tablist">${tabs.map(([k, label, n]) =>
      `<button type="button" role="tab" data-tab="${k}" aria-selected="${k === TAB}">${esc(label)}${n != null ? `<span class="cnt">${n}</span>` : ""}</button>`).join("")}</nav>`);
    const pane = k => { const d = document.createElement("div"); d.className = "pane"; d.dataset.pane = k; d.hidden = k !== TAB; main.appendChild(d); return d; };
    const pM = pane("mayor"), pC = pane("council"), pL = pane("li");
    mayorRaces.forEach(r => pM.appendChild(raceEl(cns, r)));
    if (!town) pC.insertAdjacentHTML("beforeend", '<p class="hint">選擇鄉鎮市區後，只會顯示您所屬的議員選區。</p>');
    councilRaces.forEach(r => pC.appendChild(raceEl(cns, r)));
    if (!town) {
      pL.insertAdjacentHTML("beforeend", '<p class="hint">請先選擇鄉鎮市區與村里。</p>');
    } else if (!LI) {
      pL.insertAdjacentHTML("beforeend", `<p><span class="pending">尚無 ${esc(town)} 村里長資料</span></p>`);
    } else {
      liRaces.forEach(r => pL.appendChild(raceEl(lns, r)));
      if (!liRaces.length) pL.insertAdjacentHTML("beforeend", '<p class="empty">此村里尚無資料</p>');
    }
    main.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => {
      TAB = b.dataset.tab;
      main.querySelectorAll(".tabs button").forEach(x => x.setAttribute("aria-selected", x === b));
      main.querySelectorAll(".pane").forEach(x => x.hidden = x.dataset.pane !== TAB);
      setHash();
    }));
    if (FOCUS) {
      const el = main.querySelector(`.pane:not([hidden]) .card[data-cid="${CSS.escape(FOCUS)}"]`);
      if (el) { FOCUS = null; el.classList.add("hit"); setTimeout(() => el.scrollIntoView({ block: "center" }), 50); }
    }
    const tl = (COUNTY.meta && COUNTY.meta.timeline) || [];
    $("#timeline").innerHTML = tl.length ? `<h2>選舉時程</h2><ol class="tl">${tl.map(t => `<li><b>${esc(t.date)}</b> ${esc(t.item)}${srcLinks(cns, t.src)}</li>`).join("")}</ol>` : "";
    $("#sources").innerHTML = SRC_ORDER.length ? `<h2>資料出處</h2><ol class="src-list">${SRC_ORDER.map((k, i) => {
      const s = SRC[k];
      return `<li id="src-${i + 1}"><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a>（擷取 ${esc(s.accessed || "—")}）</li>`;
    }).join("")}</ol>` : "";
  }

  async function onCounty(keepTown, keepVillage) {
    const code = $("#sel-county").value;
    COUNTY = null; LI = null;
    fillSelect($("#sel-town"), [], code ? "載入中…" : "請先選縣市");
    fillSelect($("#sel-village"), [], "請先選鄉鎮市區");
    if (code) {
      const entry = INDEX.counties.find(c => c.code === code);
      COUNTY = await getJSON("data/" + (entry.file || code + ".json"));
      if (!COUNTY) { $("#races").innerHTML = `<p class="err">${esc(entry.name)} 的資料檔還沒建立。</p>`; fillSelect($("#sel-town"), [], "尚無資料"); return; }
      fillSelect($("#sel-town"), townsOf(COUNTY), "全部（只看縣市長）");
      if (keepTown) { $("#sel-town").value = keepTown; await onTown(keepVillage); return; }
    }
    setHash(); render();
  }
  async function onTown(keepVillage) {
    const code = $("#sel-county").value, town = $("#sel-town").value;
    LI = null;
    fillSelect($("#sel-village"), [], town ? "載入中…" : "請先選鄉鎮市區");
    if (town) {
      LI = await getJSON(`data/${code}/li-${encodeURIComponent(town)}.json`);
      const villages = LI ? [...new Set((LI.races || []).map(r => r.village).filter(Boolean))] : [];
      fillSelect($("#sel-village"), villages, villages.length ? "全部村里" : "尚無村里資料");
      if (keepVillage && villages.includes(keepVillage)) $("#sel-village").value = keepVillage;
    }
    setHash(); render();
  }

  let SEARCH = null;
  const norm = x => (x || "").replace(/[\s．‧·・.]/g, "").toLowerCase();
  async function loadSearch() {
    if (!SEARCH) SEARCH = getJSON("data/search.json").then(d => (d && d.rows || []).map(([n, p, ri, k]) => {
      const [code, race, tab, t, v, pre] = d.races[ri];
      return { r: [n, d.parties[p], code, race, tab, t, v, `${pre}-${k}`], k: norm(n) };
    }));
    return SEARCH;
  }
  function countyName(code) { const c = (INDEX && INDEX.counties || []).find(x => x.code === code); return c ? c.name : code; }
  async function doSearch() {
    const q = norm($("#q").value), box = $("#q-results");
    if (!q) { box.hidden = true; box.innerHTML = ""; return; }
    box.hidden = false;
    box.innerHTML = '<li class="more">載入名單中…</li>';
    const all = await loadSearch();
    if (norm($("#q").value) !== q) return;
    const hits = all.filter(x => x.k.includes(q)).sort((a, b) => (b.k === q) - (a.k === q) || (b.k.startsWith(q)) - (a.k.startsWith(q)));
    const LIM = 50;
    box.innerHTML = hits.length ? hits.slice(0, LIM).map((x, i) => {
      const [name, party, code, race] = x.r;
      return `<li tabindex="0" data-i="${i}"><span class="qn">${esc(name)}</span>　${esc(party)}<span class="qm">${esc(race.startsWith(countyName(code)) ? race : countyName(code) + " " + race)}</span></li>`;
    }).join("") + (hits.length > LIM ? `<li class="more">共 ${hits.length} 筆，只列前 ${LIM} 筆，請輸入更完整的姓名</li>` : "")
      : '<li class="more">查無符合的候選人（目前名單為登記階段）</li>';
    box.querySelectorAll("li[data-i]").forEach(li => {
      const go = () => {
        const [, , code, , tab, t, v, cid] = hits[+li.dataset.i].r;
        const p = new URLSearchParams(); p.set("c", code); if (t) p.set("t", t); if (v) p.set("v", v); if (tab !== "mayor") p.set("tab", tab);
        FOCUS = cid; box.hidden = true;
        if (location.hash === "#" + p.toString()) render(); else location.hash = p.toString();
      };
      li.addEventListener("click", go);
      li.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
    });
  }
  let qTimer = null;
  $("#q").addEventListener("input", () => { clearTimeout(qTimer); qTimer = setTimeout(doSearch, 200); });
  $("#q").addEventListener("focus", () => { loadSearch(); if ($("#q").value) doSearch(); });
  (window.requestIdleCallback || (f => setTimeout(f, 1500)))(() => loadSearch());   // 閒置時先在背景下載名單

  // 戶籍地址 → 縣市／鄉鎮市區／村里（只在瀏覽器內比對）
  const OLD_COUNTY = { "臺北縣": "新北市", "桃園縣": "桃園市", "臺中縣": "臺中市", "臺南縣": "臺南市", "高雄縣": "高雄市" };
  // 村里界圖（內政部）＋點在多邊形內判斷，全部在瀏覽器內完成
  function inRing(x, y, r) { let c = false; for (let i = 0, j = r.length - 1; i < r.length; j = i++) { const [xi, yi] = r[i], [xj, yj] = r[j]; if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) c = !c; } return c; }
  function inGeom(x, y, g) { const ps = g.type === "Polygon" ? [g.coordinates] : g.coordinates; return ps.some(p => inRing(x, y, p[0]) && !p.slice(1).some(h => inRing(x, y, h))); }
  async function villageAt(code, town, lon, lat) {
    const fs = await getJSON(`data/${code}/vb-${encodeURIComponent(town)}.json`);
    const f = (fs || []).find(f => inGeom(lon, lat, f.g));
    return f ? f.v : null;
  }
  function locateVillage() {
    const msg = $("#addr-msg"), code = $("#sel-county").value, town = $("#sel-town").value;
    const show = h => { msg.innerHTML = h; msg.hidden = false; };
    if (!code || !town) return show("請先輸入地址或選好縣市與鄉鎮市區。");
    if (!navigator.geolocation) return show("此瀏覽器不支援定位，請從「村里」選單選擇。");
    show("定位中…（位置只在您的裝置上比對，不會傳送）");
    navigator.geolocation.getCurrentPosition(async pos => {
      const v = await villageAt(code, town, pos.coords.longitude, pos.coords.latitude);
      if (!v) return show(`您目前的位置不在${esc(town)}範圍內，請到戶籍地再使用，或從「村里」選單選擇。`);
      location.hash = new URLSearchParams({ c: code, t: town, v, tab: "li" }).toString();
      show(`依目前位置判斷為 <b>${esc(town)} ${esc(v)}</b>（定位誤差約 ${Math.round(pos.coords.accuracy)} 公尺；靠近里界時請再確認）。`);
    }, () => show("無法取得位置（可能未授權定位），請從「村里」選單選擇。"), { enableHighAccuracy: true, timeout: 15000 });
  }
  // 門牌索引：{ 路街段或地區: 里 | { 巷弄: 里 | { 號: 里 | [里...] } } }；正規化與產檔一致（NFKC、去空白、台→臺）
  const normDoor = s => (s || "").normalize("NFKC").replace(/\s/g, "").replace(/台/g, "臺").replace(/[‐–—－]/g, "-");
  async function doorVillage(code, town, rest) {
    const idx = await getJSON(`data/addr/${code}/${encodeURIComponent(town)}.json`);
    if (!idx) return null;
    const s = normDoor(rest).replace(/^\d+鄰/, "");
    const key = Object.keys(idx).filter(k => k !== "_meta" && s.startsWith(k)).sort((x, y) => y.length - x.length)[0];
    if (!key) return null;
    const r = s.slice(key.length).replace(/^\d+鄰/, "");
    const m = r.match(/^([^\d]*?巷)?(\d+巷)?(\d+弄)?(臨)?(\d+)?(?:(?:之|-)(\d+))?/);
    const lane = (m[1] || "") + (m[2] || "") + (m[3] || "");
    const no = m[5] ? (m[4] || "") + m[5] + (m[6] ? "之" + m[6] : "") : "";
    const flat = x => typeof x === "string" ? [x] : Array.isArray(x) ? x : Object.values(x).flatMap(flat);
    let n = idx[key];
    if (typeof n === "string") return { v: n };
    const ln = n[lane];
    if (ln == null) return { list: [...new Set(flat(n))] };
    if (typeof ln === "string") return { v: ln };
    const exact = ln[no], baseHit = m[5] && no !== m[5] ? ln[m[5]] : undefined;
    if (typeof exact === "string") return { v: exact };
    if (Array.isArray(exact)) return { list: exact };
    if (typeof baseHit === "string") return { v: baseHit, guess: `${m[5]}號` };
    if (m[5]) {   // 門牌檔沒有這個號：看同側（同單雙號）前後最近的門牌，兩邊同一里才推估
      const want = +m[5], same = Object.keys(ln).map(k => [parseInt(k.replace(/^臨/, ""), 10), ln[k]])
        .filter(([k, v]) => !isNaN(k) && k % 2 === want % 2 && typeof v === "string");
      const lo = same.filter(([k]) => k < want).sort((a, b) => b[0] - a[0])[0], hi = same.filter(([k]) => k > want).sort((a, b) => a[0] - b[0])[0];
      const near = [lo, hi].filter(x => x && Math.abs(x[0] - want) <= 20);   // 只看前後各 20 號內
      if (near.length === 2 && near[0][1] === near[1][1]) return { v: lo[1], guess: `${lo[0]}號與${hi[0]}號` };
      if (near.length) return { list: [...new Set(near.map(x => x[1]))] };
      return null;   // 號碼超出門牌資料範圍：不提示里
    }
    return { list: [...new Set(flat(ln))] };
  }
  async function matchAddr() {
    const msg = $("#addr-msg");
    const show = h => { msg.innerHTML = h; msg.hidden = false; };
    let a = ($("#addr").value || "").replace(/台/g, "臺").replace(/[\s　]/g, "").replace(/^\d{3,6}/, "");
    if (!a) { msg.hidden = true; return; }
    let county = (INDEX.counties || []).find(c => a.startsWith(c.name)), upgraded = false;
    if (!county) {
      const old = Object.keys(OLD_COUNTY).find(k => a.startsWith(k));
      if (old) { county = INDEX.counties.find(c => c.name === OLD_COUNTY[old]); a = county.name + a.slice(old.length); upgraded = true; }
    }
    if (!county) return show("找不到縣市，請從縣市名稱開始輸入（例：高雄市…）。");
    const cdata = await getJSON(`data/${county.file || county.code + ".json"}`);
    const rest = a.slice(county.name.length);
    let town = null, after = "";
    for (const t of (cdata && cdata.towns) || []) {
      const base = t.slice(0, -1);
      if (rest.startsWith(t)) { if (!town || t.length > town.length) { town = t; after = rest.slice(t.length); } }
      else if (base.length >= 2 && rest.startsWith(base) && /[鄉鎮市區]/.test(rest[base.length] || "")) { if (!town) { town = t; after = rest.slice(base.length + 1); } }
    }
    if (!town) {
      location.hash = new URLSearchParams({ c: county.code }).toString();
      return show(`已帶入 <b>${esc(county.name)}</b>，但找不到鄉鎮市區，請從選單選擇。`);
    }
    const li = await getJSON(`data/${county.code}/li-${encodeURIComponent(town)}.json`);
    const vils = li ? [...new Set((li.races || []).map(r => r.village))] : [];
    const vil = vils.filter(v => after.startsWith(v)).sort((x, y) => y.length - x.length)[0];   // 只接受官方村里名稱的精確比對
    const claimed = !vil && (after.match(/^([^\d路街道段巷弄號村里]{1,4}[村里])(?=\d|[^路街道])/) || [])[1];
    let door = null;
    if (county.addr_index) door = await doorVillage(county.code, town, vil ? after.slice(vil.length) : after);
    const conflict = vil && door && door.v && door.v !== vil && !door.guess ? door.v : null;
    const dv = !vil && door && door.v && vils.includes(door.v) ? door.v : null;
    const p = new URLSearchParams({ c: county.code, t: town });
    if (vil || dv) { p.set("v", vil || dv); p.set("tab", "li"); } else p.set("tab", "council");
    if (dv) {
      location.hash = p.toString();
      return show(`已依門牌帶入 <b>${esc(county.name)} ${esc(town)} ${esc(dv)}</b>${upgraded ? "（舊縣名已換成現行行政區）" : ""}（門牌對照：${esc(county.name)}開放門牌資料${door.guess ? `；門牌資料中沒有這個號，依相鄰的 ${esc(door.guess)} 推估，請確認` : ""}）。`);
    }
    if (!vil && door && door.list && door.list.length) {
      location.hash = p.toString();
      return show(`已帶入 <b>${esc(county.name)} ${esc(town)}</b>。依門牌資料，這個地址可能屬於：${door.list.map(esc).join("、")}，請從「村里」選單選擇（地址若沒寫門牌號碼，補上後可直接帶入）。`);
    }
    location.hash = p.toString();
    show(`已帶入 <b>${esc(county.name)} ${esc(town)}${vil ? " " + esc(vil) : ""}</b>${upgraded ? "（舊縣名已換成現行行政區）" : ""}。` +
      (conflict ? `⚠️ 地址寫${esc(vil)}，但${esc(county.name)}門牌資料顯示這個門牌屬於<b>${esc(conflict)}</b>，請確認（里界可能調整過，以戶籍資料為準）。` : "") +
      (vil ? "" : (claimed
        ? `在${esc(town)}的村里清單中找不到「${esc(claimed)}」，可能已合併、改名或有錯字。`
        : "地址中沒有寫村里。") + "請從「村里」選單選擇，或在戶籍地按「📍 用目前位置判斷村里」。"));
  }
  $("#addr-go").addEventListener("click", matchAddr);
  $("#geo-go").addEventListener("click", locateVillage);
  $("#addr").addEventListener("keydown", e => { if (e.key === "Enter") matchAddr(); });

  getJSON("data/index.json").then(idx => {
    if (!idx) throw new Error("找不到 data/index.json");
    INDEX = idx;
    if (idx.title) { $("#title").textContent = idx.title; document.title = idx.title; }
    $("#sub").textContent = `投票日 ${idx.vote_date || "—"}｜索引更新 ${idx.updated || "—"}`;
    fillSelect($("#sel-county"), [], "請選擇");
    $("#sel-county").innerHTML = '<option value="">請選擇</option>' + (idx.counties || []).map(c => `<option value="${esc(c.code)}">${esc(c.name)}</option>`).join("");
    $("#sel-county").disabled = false;
    $("#sel-county").addEventListener("change", () => onCounty());
    $("#sel-town").addEventListener("change", () => onTown());
    $("#sel-village").addEventListener("change", () => { setHash(); render(); });
    function applyHash() {
      const p = new URLSearchParams((location.hash || "").slice(1));
      const c = p.get("c") || "", t = p.get("t") || "", v = p.get("v") || "";
      const tab = ["mayor", "council", "li"].includes(p.get("tab")) ? p.get("tab") : "mayor";
      if (c === $("#sel-county").value && t === $("#sel-town").value && v === $("#sel-village").value) {
        if (tab !== TAB) { TAB = tab; render(); }
        return;
      }
      TAB = tab;
      $("#sel-county").value = idx.counties.some(x => x.code === c) ? c : "";
      onCounty(t, v);
    }
    window.addEventListener("hashchange", applyHash);
    applyHash();
  }).catch(e => { $("#races").innerHTML = `<p class="err">讀取資料失敗（${esc(e.message)}）。若是直接用檔案開啟，請改用網頁伺服器。</p>`; });
})();
</script>
</body>
</html>
